font-size:12px}.error{background:#fff0eb;color:#993b2b;padding:15px;border-radius:9px}.hidden{display:none!important}#message{min-height:26px;margin:15px 0;color:#316d48}.list{margin:15px 0}.list button{width:100%;text-align:left;margin:6px 0;padding:16px}.linkbox{background:#f1f6f2;padding:12px;border-radius:9px;margin:8px 0;overflow-wrap:anywhere}details{border-bottom:1px solid #dce6df;padding:16px 0}summary{cursor:pointer;font-weight:bold}.answer{background:#f5f8f6;border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}.score{display:flex;gap:15px;align-items:center}.score input{width:90px}.tabs{display:flex;gap:10px;margin:22px 0}.tabactive{background:#d9eddf}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #e2eae4;text-align:left}footer{color:#78917f;font-size:12px;text-align:center;margin:40px}#editor{max-width:900px}.mini{padding:5px 11px;font-size:13px}.red{color:#a54436}.empty{padding:35px;text-align:center;color:#728879}@media(max-width:650px){header{align-items:start}header b{font-size:19px}h1{font-size:25px}.grid{grid-template-columns:1fr}.panel{padding:18px}main{padding:0 15px;margin:25px auto}.task-image{display:block;max-width:100%;max-height:600px;object-fit:contain;border:1px solid #d7e4db;border-radius:9px;margin:14px 0;background:white}.variant{padding-left:10px}.row button{flex-grow:1}}

const $=s=>document.querySelector(s),app=$('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let assignments=[],selected=null,submissions=[],draft=null,variant=0,studentAssignment=null,timer=null,sending=false;function message(s,error=false){$('#message').className=error?'error':'';$('#message').textContent=s}async function api(path,options={}){const res=await fetch(path,{...options,headers:{'content-type':'application/json',...options.headers}});let data=await res.json();if(!res.ok)throw Error(data.error||'Қосылу қатесі');return data}async function run(fn){message('');try{await fn()}catch(e){message(e.message,true)}}function download(name,rows){let text='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function stop(){clearInterval(timer);timer=null}async function dashboard(){app.oninput=null;stop();assignments=await api('/api/teacher/assignments');selected=null;app.innerHTML=`<div class="row spread"><div><span class="quiet">МҰҒАЛІМ КАБИНЕТІ</span><h1>Онлайн тапсырмалар</h1><p class="quiet">Тапсырма құрыңыз, сілтемені таратыңыз, жауаптарды осы жерден көріңіз.</p></div><div class="row"><button id="paperSection">Қағаздан фото арқылы тексеру</button><button class="primary" id="create">＋ Жаңа тапсырма</button></div></div><div class="note">Бұрынғы тексеру бөлімі сақталған. Бұл бөлімдегі тапсырмалар мен жауаптар серверде сақталып, басқа құрылғыдан да ашылады.</div><div class="list">${assignments.map((a,i)=>`<button data-open="${i}"><div class="row spread"><b>${esc(a.title)}</b><span class="pill">${a.open?'Қабылдау ашық':'Жабық'}</span></div><span class="quiet">${esc(a.grade)} · ${a.variants.length} нұсқа · ${a.count} жауап</span></button>`).join('')||'<div class="panel empty">Әзірге тапсырма жоқ. «Жаңа тапсырма» батырмасын басыңыз.</div>'}</div>`;$('#paperSection').onclick=()=>run(paperDashboard);$('#create').onclick=()=>editor();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>run(()=>openAssignment(assignments[+b.dataset.open])))}
function newTask(){return {prompt:'',image:'',desc:'',type:'manual',answer:'',max:1}}function editor(){stop();draft={title:'',grade:'',objectives:'',instructions:'Барлық тапсырманы орындап, «Жұмысты жіберу» батырмасын басыңыз.',variants:[{name:'1-нұсқа',tasks:[newTask()]}]};try{let saved=localStorage.getItem('online-task-draft');if(saved&&confirm('Сақталған тапсырма жобасын ашу керек пе?'))draft=JSON.parse(saved)}catch{}renderEditor()}function saveDraft(){try{localStorage.setItem('online-task-draft',JSON.stringify(draft))}catch{}}function renderEditor(){app.innerHTML=`<div class="row spread"><h1>Жаңа онлайн тапсырма</h1><button id="back">← Тізімге</button></div><div class="panel" id="editor"><div class="grid"><label>1. Жиынтық бағалау бөлімі<input data-root="title" maxlength="200" value="${esc(draft.title)}" placeholder="Мысалы: Компьютерлік желілер"></label><label>2. Сынып<input data-root="grade" maxlength="80" value="${esc(draft.grade)}" placeholder="9А"></label></div><label>3. Оқу мақсаттары<textarea data-root="objectives" maxlength="4000" placeholder="Оқу мақсатының коды мен толық мәтінін енгізіңіз…">${esc(draft.objectives||'')}</textarea></label><label>4. Оқушыға нұсқаулық<textarea data-root="instructions" maxlength="4000">${esc(draft.instructions)}</textarea></label><div class="note">Нақты жауаптар кілтпен автоматты тексеріледі. Ашық жауаптар мұғалім бағалауын күтеді. Жарияланған тапсырма өзгермейді; жаңа жұмыс үшін жаңа тапсырма құрыңыз.</div>${draft.variants.map((v,vi)=>`<div class="variant"><div class="row spread"><h2>${esc(v.name)}</h2>${draft.variants.length>1?`<button class="mini red" data-delv="${vi}">Нұсқаны жою</button>`:''}</div><label>Нұсқа атауы<input data-vname="${vi}" maxlength="100" value="${esc(v.name)}"></label>${v.tasks.map((t,ti)=>`<div class="task"><div class="row spread"><b>${ti+1}-тапсырма</b>${v.tasks.length>1?`<button class="mini red" data-delt="${vi},${ti}">Жою</button>`:''}</div><label>Тапсырма мәтіні<textarea class="long" data-v="${vi}" data-t="${ti}" data-f="prompt" maxlength="6000" placeholder="Оқушы орындайтын тапсырманы осында жазыңыз…">${esc(t.prompt)}</textarea></label><label>Тапсырмаға сурет қосу<input type="file" data-image="${vi},${ti}" accept="image/png,image/jpeg,image/webp"><span class="quiet">PNG, JPG, WebP · бастапқы сурет 5 МБ-қа дейін. Үлкен сурет 500 КБ-қа дейін ықшамдалады. Ctrl+V арқылы да қоюға болады.</span></label>${t.image?`<img class="task-image" src="/api/teacher/images/${esc(t.image)}" alt="Тапсырма суреті"><button type="button" class="mini red" data-removeimg="${vi},${ti}">Суретті алып тастау</button>`:''}${tableEditor(t,vi,ti)}<div class="grid"><label>Тексеру түрі<select data-v="${vi}" data-t="${ti}" data-f="type"><option value="manual" ${t.type==='manual'?'selected':''}>Ашық жауап · мұғалім бағалайды</option><option value="exact" ${t.type==='exact'?'selected':''}>Нақты жауап · автоматты</option></select></label><label>Ең жоғары балл<input data-v="${vi}" data-t="${ti}" data-f="max" type="number" min="0.5" max="100" step="0.5" value="${t.max}"></label></div>${t.type==='exact'?`<label>Дұрыс жауап · тек мұғалімге көрінеді<input data-v="${vi}" data-t="${ti}" data-f="answer" maxlength="2000" value="${esc(t.answer)}" placeholder="Бірнеше дұрыс жауапты | белгісімен бөліңіз"></label>`:''}<label>Дескриптор · мұғалім үшін<input data-v="${vi}" data-t="${ti}" data-f="desc" maxlength="1000" value="${esc(t.desc)}" placeholder="Нені бағалайсыз?"></label></div>`).join('')}<button data-addt="${vi}">＋ Тапсырма қосу</button></div>`).join('')}<div class="row"><button id="addVariant">＋ Нұсқа қосу</button><button id="publish" class="primary">Жариялау және сілтеме алу →</button></div><p class="quiet">Жоба осы браузерде сақталады. Жариялағаннан кейін серверге сақталады.</p></div>`;$('#back').onclick=()=>run(dashboard);$('#addVariant').onclick=()=>{if(draft.variants.length>=10){message('Ең көбі 10 нұсқа.',true);return}draft.variants.push({name:`${draft.variants.length+1}-нұсқа`,tasks:[newTask()]});saveDraft();renderEditor()};$('#publish').onclick=()=>run(async()=>{let b=$('#publish');b.disabled=true;try{let created=await api('/api/teacher/assignments',{method:'POST',body:JSON.stringify(draft)});localStorage.removeItem('online-task-draft');assignments=await api('/api/teacher/assignments');await openAssignment(assignments.find(a=>a.id===created.id));message('Тапсырма жарияланды. Оқушы сілтемесін көшіріп таратыңыз.')}finally{b.disabled=false}});$('#editor').oninput=e=>{let d=e.target.dataset;if(d.cell){let [v,t,r,c]=d.cell.split(',').map(Number);draft.variants[v].tasks[t].table.cells[r][c].text=e.target.value;}else if(d.editcell){let [v,t,r,c]=d.editcell.split(',').map(Number);draft.variants[v].tasks[t].table.cells[r][c].editable=e.target.checked;}else if(d.root)draft[d.root]=e.target.value;else if(d.vname!==undefined)draft.variants[+d.vname].name=e.target.value;else if(d.f){draft.variants[+d.v].tasks[+d.t][d.f]=d.f==='max'?Number(e.target.value):e.target.value}saveDraft()};$('#editor').onchange=e=>{if(e.target.dataset.image){const [v,t]=e.target.dataset.image.split(',').map(Number);const file=e.target.files?.[0];if(file)run(()=>uploadImage(file,v,t));}else if(e.target.dataset.f==='type'){let d=e.target.dataset;if(draft.variants[+d.v].tasks[+d.t].table)draft.variants[+d.v].tasks[+d.t].type='manual';saveDraft();renderEditor()}};$('#editor').onpaste=e=>{const d=e.target.dataset;if(d.f!=='prompt')return;const item=Array.from(e.clipboardData?.items||[]).find(x=>x.type.startsWith('image/'));if(item){e.preventDefault();run(()=>uploadImage(item.getAsFile(),+d.v,+d.t))}};$('#editor').onclick=e=>{let d=e.target.dataset;if(d.tableaction){tableAction(e.target);return}if(d.removeimg){const [v,t]=d.removeimg.split(',').map(Number);draft.variants[v].tasks[t].image='';saveDraft();renderEditor();return}if(d.addt!==undefined){let v=draft.variants[+d.addt];if(v.tasks.length>=30){message('Әр нұсқаға ең көбі 30 тапсырма.',true);return}v.tasks.push(newTask());saveDraft();renderEditor()}if(d.delt){let [v,t]=d.delt.split(',').map(Number);draft.variants[v].tasks.splice(t,1);saveDraft();renderEditor()}if(d.delv!==undefined){draft.variants.splice(+d.delv,1);saveDraft();renderEditor()}}}

function answerText(a,t){if(!t?.table)return a;let values=[];try{values=JSON.parse(a).cells||[]}catch{}return t.table.cells.map((row,r)=>row.map((c,col)=>c.editable?(values[r]?.[col]||''):c.text).join(' | ')).join('\n')}
function answerEmpty(a,t){if(!t?.table)return !a?.trim();try{let x=JSON.parse(a).cells;return t.table.cells.some((row,r)=>row.some((c,col)=>c.editable&&!x[r][col].trim()))}catch{return true}}
function tableEditor(t,v,i){if(!t.table)return `<button type="button" data-tableaction="add" data-pos="${v},${i}">＋ Кесте қосу</button>`;return `<div class="panel"><h3>Тапсырма кестесі</h3><p class="quiet">Мәтінді ұяшықтарға жазыңыз. «Оқушы толтырады» белгісі бар ұяшық оқушыға бос ашылады. Кестені мұғалім бағалайды.</p><div class="row">${[['row','Жол қосу'],['col','Баған қосу'],['delrow','Соңғы жолды жою'],['delcol','Соңғы бағанды жою'],['remove','Кестені жою']].map(([a,n])=>`<button type="button" class="mini" data-tableaction="${a}" data-pos="${v},${i}">${n}</button>`).join('')}</div><div class="tablewrap"><table class="tasktable"><tbody>${t.table.cells.map((row,r)=>`<tr>${row.map((c,col)=>`<td><textarea aria-label="${r+1}-жол, ${col+1}-баған" maxlength="500" data-cell="${v},${i},${r},${col}">${esc(c.text)}</textarea><label><input type="checkbox" data-editcell="${v},${i},${r},${col}" ${c.editable?'checked':''}> Оқушы толтырады</label></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function tableAction(b){let [v,i]=b.dataset.pos.split(',').map(Number),t=draft.variants[v].tasks[i],a=b.dataset.tableaction;const cell=()=>({text:'',editable:false});if(a==='add'){t.table={cells:Array.from({length:3},(_,r)=>Array.from({length:3},(_,c)=>({text:r===0?`${c+1}-баған`:'',editable:r>0&&c>0})))};t.type='manual'}else if(a==='remove'){if(!confirm('Кестені жою керек пе?'))return;delete t.table}else{let rows=t.table.cells;if(a==='row'&&rows.length<20)rows.push(rows[0].map(()=>cell()));if(a==='col'&&rows[0].length<10)rows.forEach(r=>r.push(cell()));if(a==='delrow'&&rows.length>1&&confirm('Соңғы жолды жою керек пе?'))rows.pop();if(a==='delcol'&&rows[0].length>1&&confirm('Соңғы бағанды жою керек пе?'))rows.forEach(r=>r.pop())}saveDraft();renderEditor()}
function tableView(t,i,answer,editable){let values=[];try{values=JSON.parse(answer).cells||[]}catch{}return `<p class="quiet">${editable?'Сары ұяшықтарға жауабыңызды жазыңыз.':'Оқушы толтырған кесте'}</p><div class="tablewrap"><table class="tasktable"><tbody>${t.table.cells.map((row,r)=>`<tr>${row.map((c,col)=>`<td class="${c.editable?'editablecell':'fixedcell'}">${c.editable?(editable?`<textarea aria-label="${r+1}-жол, ${col+1}-баған жауабы" maxlength="500" data-tableanswer="${i},${r},${col}" placeholder="Жауап…">${esc(values[r]?.[col]||'')}</textarea>`:esc(values[r]?.[col]||'—')):esc(c.text)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}


let paperDBPromise,paperRecords=[],paperCurrent=null,paperPhotoIndex=0,paperRotation=0;
function paperDB(){return paperDBPromise||(paperDBPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('bzb419-paper',1);r.onupgradeneeded=()=>r.result.createObjectStore('works',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(Error('Осы браузерде сақтау ашылмады.'))}))}
async function paperStore(mode,value){const db=await paperDB();return new Promise((resolve,reject)=>{const tx=db.transaction('works',mode==='get'?'readonly':'readwrite'),st=tx.objectStore('works');let result;const r=mode==='get'?st.getAll():mode==='delete'?st.delete(value):st.put(value);r.onsuccess=()=>result=r.result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(Error('Сақтау орындалмады. Браузердегі бос орынды тексеріңіз.'));tx.onabort=()=>reject(Error('Сақтау тоқтатылды.'))})}
function paperTotal(w){return w.criteria.reduce((n,c)=>n+(c.score===null?0:Number(c.score)),0)}
function paperMaximum(w){return w.criteria.reduce((n,c)=>n+Number(c.max),0)}
function paperDownload(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function paperDashboard(){app.oninput=null;stop();paperCurrent=null;paperRecords=(await paperStore('get')).sort((a,b)=>b.updated.localeCompare(a.updated));app.innerHTML=`<a class="button" href="/online">← Онлайн тапсырмалар</a><div class="row spread"><div><h1>Қағаздан фото арқылы тексеру</h1><p class="quiet">Информатика · №419 кабинет · Мадетхан Л.</p></div><button id="newPaper" class="primary">＋ Қағаз жұмыс қосу</button></div><div class="note"><b>Фотосуретті қарап, балды мұғалім қояды.</b> Қолжазба автоматты танылмайды. Фотолар мен бағалар осы құрылғыдағы браузерде сақталады. Басқа құрылғыға көшіру немесе сақтық көшірме үшін «Көшірмені жүктеу» қолданыңыз.</div><div class="row" style="margin-top:16px"><button id="paperBackup">Көшірмені жүктеу ↓</button><button id="paperCSV">Бағалар CSV ↓</button><label class="button">Көшірмені ашу<input id="paperRestore" type="file" accept="application/json,.json" style="max-width:250px"></label></div><div class="list">${paperRecords.map((w,i)=>`<button data-paperopen="${i}"><b>${esc(w.name)} · ${esc(w.grade)}</b><div class="quiet">${esc(w.title)} · ${w.photos.length} фото · ${paperTotal(w)} / ${paperMaximum(w)} балл · ${w.criteria.some(c=>c.score===null)?'Бағалау күтілуде':'Бағаланды'}</div></button>`).join('')||'<div class="panel empty">Әзірге қағаз жұмысы қосылмаған.</div>'}</div>`;$('#newPaper').onclick=()=>{paperCurrent={id:crypto.randomUUID(),title:'',name:'',grade:'',key:'',feedback:'',photos:[],criteria:[{label:'1-тапсырма',max:1,score:null}],updated:new Date().toISOString()};paperPhotoIndex=0;paperRotation=0;renderPaper()};document.querySelectorAll('[data-paperopen]').forEach(b=>b.onclick=()=>{paperCurrent=structuredClone(paperRecords[+b.dataset.paperopen]);paperPhotoIndex=0;paperRotation=0;renderPaper()});$('#paperBackup').onclick=()=>paperDownload('bzb419_paper_backup.json',JSON.stringify({format:'bzb419-paper-v1',works:paperRecords}),'application/json');$('#paperCSV').onclick=()=>download('bzb419_paper_results.csv',[['Оқушы','Сынып','Жұмыс','Балл','Ең жоғары балл','Күйі','Пікір'],...paperRecords.map(w=>[w.name,w.grade,w.title,paperTotal(w),paperMaximum(w),w.criteria.some(c=>c.score===null)?'Күтілуде':'Бағаланды',w.feedback])]);$('#paperRestore').onchange=e=>run(async()=>{const file=e.target.files?.[0];if(!file)return;if(file.size>50*1024*1024)throw Error('Көшірме 50 МБ-тан аспауы керек.');let data;try{data=JSON.parse(await file.text())}catch{throw Error('Көшірме файлы ашылмады.')}if(data.format!=='bzb419-paper-v1'||!Array.isArray(data.works)||data.works.length>500)throw Error('Көшірме пішімі жарамсыз.');data.works.forEach(validatePaper);if(!confirm(data.works.length+' жұмысты импорттау керек пе? Бірдей коды бар жұмыстар жаңартылады.'))return;for(const w of data.works)await paperStore('put',w);await paperDashboard();message('Көшірме ашылды.');})}
function validatePaper(w){if(!w||typeof w.id!=='string'||!/^[a-f0-9-]{36}$/.test(w.id)||typeof w.updated!=='string'||!['title','name','grade','key','feedback'].every(k=>typeof w[k]==='string'&&w[k].length<=10000)||!w.title.trim()||!w.name.trim()||!w.grade.trim()||!Array.isArray(w.photos)||!w.photos.length||w.photos.length>10||w.photos.some(x=>typeof x!=='string'||x.length>800000||!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(x))||!Array.isArray(w.criteria)||!w.criteria.length||w.criteria.length>30||w.criteria.some(c=>!c||typeof c.label!=='string'||c.label.length>200||!Number.isFinite(c.max)||c.max<=0||c.max>100||c.score!==null&&(!Number.isFinite(c.score)||c.score<0||c.score>c.max)))throw Error('Жұмыс деректері жарамсыз: аты-жөні, сыныбы, тақырыбы, фото және балдарды тексеріңіз.')}

function renderPaper(){const w=paperCurrent;app.innerHTML=`<button id="paperBack">← Қағаз жұмыстар</button><h1>Қағаз жұмысты тексеру</h1><div class="note">Жұмыс фотосын қарап, жауап кілтімен салыстырыңыз. Әр тапсырмаға балл қойып, «Сақтау» басыңыз. Сақтау осы браузерде орындалады.</div><div class="grid"><label>Оқушының аты-жөні<input id="paperName" maxlength="120" value="${esc(w.name)}"></label><label>Сыныбы<input id="paperGrade" maxlength="60" value="${esc(w.grade)}"></label></div><label>БЖБ / жұмыс тақырыбы<input id="paperTitle" maxlength="200" value="${esc(w.title)}"></label><label>Жұмыс фотолары · ең көбі 10 бет<input id="paperPhotos" type="file" multiple accept="image/png,image/jpeg,image/webp"><span class="quiet">PNG, JPG, WebP · әр фото 5 МБ-қа дейін. Телефон фотосын JPG түрінде сақтаңыз.</span></label><div class="grid"><div class="panel"><div class="row"><button type="button" id="photoPrev">←</button><span id="photoCount"></span><button type="button" id="photoNext">→</button><button type="button" id="photoRotate">↻ Бұру</button><button type="button" id="photoRemove" class="red">Фотоны жою</button></div><label>Масштаб<input id="photoZoom" type="range" min="50" max="200" value="100"></label><div style="overflow:auto;max-height:650px;background:#edf3ef;padding:10px" id="paperViewer"></div></div><div class="panel"><label>Дұрыс жауаптар / бағалау кілті<textarea id="paperKey" class="long" maxlength="10000" placeholder="Әр тапсырманың дұрыс жауабын осында жазыңыз…">${esc(w.key)}</textarea></label><h2>Тапсырмалар бойынша балл</h2>${w.criteria.map((c,i)=>`<div class="task"><label>Тапсырма / дескриптор<input data-papercriterion="${i},label" maxlength="200" value="${esc(c.label)}"></label><div class="grid"><label>Ең жоғары балл<input type="number" min="0.5" max="100" step="0.5" data-papercriterion="${i},max" value="${c.max}"></label><label>Қойылған балл<input type="number" min="0" max="${c.max}" step="0.5" data-papercriterion="${i},score" value="${c.score??''}" placeholder="Әлі бағаланбаған"></label></div>${w.criteria.length>1?`<button class="mini red" data-paperdelcriterion="${i}">Жолды жою</button>`:''}</div>`).join('')}<button id="paperAddCriterion">＋ Тапсырма қосу</button><h2 style="margin-top:20px">Жиынтық: <span id="paperTotal">${paperTotal(w)} / ${paperMaximum(w)}</span></h2><label>Мұғалім пікірі<textarea id="paperFeedback" maxlength="3000">${esc(w.feedback)}</textarea></label><div class="row"><button class="primary" id="paperSave">Сақтау</button><button class="red" id="paperDelete">Жұмысты өшіру</button></div></div></div>`;app.oninput=capturePaper;$('#paperBack').onclick=()=>run(async()=>{if(!confirm('Сақталмаған өзгерістер жоғалады. Тізімге қайту керек пе?'))return;await paperDashboard()});$('#paperPhotos').onchange=e=>run(async()=>{capturePaper();const files=[...e.target.files];if(w.photos.length+files.length>10)throw Error('Бір жұмысқа ең көбі 10 фото.');const prepared=[];for(const file of files){if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Әр фото PNG/JPG/WebP және 5 МБ-қа дейін болуы керек.');const blob=await compressImage(file);prepared.push(await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Фото оқылмады.'));r.readAsDataURL(blob)}))}w.photos.push(...prepared);paperPhotoIndex=w.photos.length-1;renderPaper();message('Фото қосылды. Жұмысты сақтау үшін «Сақтау» басыңыз.');});$('#paperAddCriterion').onclick=()=>{capturePaper();if(w.criteria.length>=30)return;w.criteria.push({label:(w.criteria.length+1)+'-тапсырма',max:1,score:null});renderPaper()};document.querySelectorAll('[data-paperdelcriterion]').forEach(b=>b.onclick=()=>{capturePaper();w.criteria.splice(+b.dataset.paperdelcriterion,1);renderPaper()});$('#paperSave').onclick=()=>run(async()=>{capturePaper();validatePaper(w);w.updated=new Date().toISOString();await paperStore('put',w);message('Жұмыс фотолары, балл және пікір осы браузерде сақта function paperViewer(){const w=paperCurrent;$('#photoCount').textContent=w.photos.length?(paperPhotoIndex+1)+' / '+w.photos.length:'Фото жоқ';$('#paperViewer').innerHTML=w.photos.length?`<img alt="Оқушының қағаз жұмысы, ${paperPhotoIndex+1}-бет" src="${w.photos[paperPhotoIndex]}" style="display:block;width:${Number($('#photoZoom').value)}%;max-width:none;transform:rotate(${paperRotation}deg);margin:${paperRotation%180?'120px':'0'} auto">`:'<p class="quiet">Тексеру үшін жұмыс фотосын қосыңыз.</p>'}

async function compressImage(file){
 const limit=500*1024;if(file.size<=limit)return file;
 let bitmap;if(typeof createImageBitmap==='function'){try{bitmap=await createImageBitmap(file)}catch{throw Error('Сурет ашылмады. PNG немесе JPG форматында қайта сақтап көріңіз.')}}else{bitmap=await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Сурет ашылмады.'))};img.src=url})}
 try{let w=bitmap.width,h=bitmap.height;const ratio=Math.min(1,2200/Math.max(w,h));w=Math.round(w*ratio);h=Math.round(h*ratio);const canvas=document.createElement('canvas');for(let pass=0;pass<7;pass++){canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Браузер суретті ықшамдай алмады.');ctx.drawImage(bitmap,0,0,w,h);for(const quality of [.90,.78,.64]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));if(blob&&blob.size<=limit&&['image/webp','image/png','image/jpeg'].includes(blob.type))return blob}w=Math.max(1,Math.round(w*.8));h=Math.max(1,Math.round(h*.8))}throw Error('Суретті 500 КБ-қа дейін ықшамдау мүмкін болмады. Кішірек суретті таңдаңыз.')}finally{bitmap.close?.()}
}

async function uploadImage(file,v,t){if(uploadingImage)throw Error('Алдыңғы суреттің жүктелуін күтіңіз.');if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('PNG, JPG немесе WebP суретін таңдаңыз.');if(file.size>5*1024*1024)throw Error('Сурет 5 МБ-тан аспауы керек.');uploadingImage=true;const task=draft.variants[v].tasks[t];let editor=$('#editor');editor?.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=true);message('Сурет жүктелуде…');try{const prepared=await compressImage(file);const res=await fetch('/api/teacher/images',{method:'POST',headers:{'content-type':prepared.type},body:prepared});const data=await res.json();if(!res.ok)throw Error(data.error||'Сурет жүктелмеді.');task.image=data.id;saveDraft();renderEditor();message('Сурет қосылды. Жариялағаннан кейін оқушыға да көрінеді.')}finally{uploadingImage=false;editor=$('#editor');editor?.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=false)}}
function studentLink(a,v){return location.origin+'/s/'+a.token+(v===undefined?'':'?v='+v)}async function openAssignment(a){stop();selected=a;submissions=await api('/api/teacher/assignments/'+a.id+'/submissions');app.innerHTML=`<button id="back">← Тапсырмаларға</button><div class="row spread"><div><h1>${esc(a.title)}</h1><p class="quiet">${esc(a.grade)} · ${a.variants.length} нұсқа</p></div><button id="deleteAssignment" class="red">Тапсырманы өшіру</button><button id="toggle">${a.open?'Жауап қабылдауды жабу':'Жауап қабылдауды ашу'}</button></div><div class="panel"><h2>Оқушыларға тарату</h2><p class="quiet">Жалпы сілтемеде оқушы нұсқасын таңдайды. Белгілі нұсқаны беру үшін оның жеке сілтемесін таратыңыз.</p><div class="linkbox"><label>Барлық нұсқалар<input readonly value="${studentLink(a)}"></label><button data-copy="${studentLink(a)}">Сілтемені көшіру</button> <a class="button" href="${studentLink(a)}" target="_blank" rel="noopener">Оқушы бетін көру ↗</a></div>${a.variants.map((v,i)=>`<div class="row linkbox"><b>${esc(v.name)}</b><button class="mini" data-copy="${studentLink(a,i)}">Сілтемені көшіру</button></div>`).join('')}</div><div class="panel"><div class="row spread"><h2>Келген жұмыстар <span id="responseCount" class="pill">${submissions.length}</span></h2><div class="row"><button id="refresh">Жаңарту</button><button id="export">CSV есебі ↓</button></div></div><p class="quiet">Жауаптар 10 секунд сайын тексеріледі. Ашық тұрған бағалау өзгертілмейді; жаңа жұмыс келсе, хабарлама шығады.</p><div id="responses"></div></div>`;$('#back').onclick=()=>run(dashboard);$('#deleteAssignment').onclick=()=>run(async()=>{if(!confirm('«'+a.title+'» тапсырмасын және оған келген '+submissions.length+' жауапты біржола өшіру керек пе? Бұл әрекетті қайтару мүмкін емес.'))return;const b=$('#deleteAssignment');b.disabled=true;try{await api('/api/teacher/assignments/'+a.id,{method:'DELETE',body:JSON.stringify({confirm:a.id})});await dashboard();message('Тапсырма және оған келген жауапта )});s.scores=scores;s.feedback=feedback;message('Бағалау сақталды.');let summary=b.closest('details').querySelector('summary .pill');summary.textContent=scores.reduce((n,x)=>n+(x||0),0)+' / '+selected.variants[s.variant].tasks.reduce((n,t)=>n+t.max,0)+(scores.includes(null)?' · бағалау күтілуде':' · бағаланды')}finally{b.disabled=false}}))}
let studentDraft={},requestId='';function stashStudent(){try{sessionStorage.setItem('task-'+studentAssignment.id,JSON.stringify({...studentDraft,requestId,variant}))}catch{}}function captureStudent(){if($('#studentName')){studentDraft.name=$('#studentName').value;studentDraft.grade=$('#studentGrade').value;studentDraft.answers=studentAssignment.variants[variant].tasks.map((t,i)=>t.table?JSON.stringify({cells:t.table.cells.map((row,r)=>row.map((c,col)=>c.editable?(document.querySelector(`[data-tableanswer="${i},${r},${col}"]`)?.value||''):c.text))}):(document.querySelector(`[data-answer="${i}"]`)?.value||''));stashStudent()}}
async function student(token){stop();$('#oldLink').classList.add('hidden');studentAssignment=await api('/api/student/'+token);const a=studentAssignment;let requested=new URLSearchParams(location.search).get('v');variant=requested!==null&&/^\d+$/.test(requested)&&a.variants[+requested]?+requested:0;requestId=crypto.randomUUID();try{let saved=JSON.parse(sessionStorage.getItem('task-'+a.id));if(saved){if(saved.received){receipt(saved.received);return}if(requested===null||+requested===saved.variant){studentDraft=saved;variant=saved.variant;requestId=saved.requestId||requestId}}}catch{}renderStudent(requested,token)}function receipt(id){app.innerHTML=`<div class="panel" style="max-width:700px;margin:60px auto;text-align:center"><h1>✓ Жұмысыңыз қабылданды!</h1><p>Жауаптарыңыз мұғалім бетіне жіберілді.</p><p class="quiet">Мұғалім тексергеннен кейін нәтижені хабарлайды.</p><p class="quiet">Қабылдау коды: ${esc(id)}</p></div>`;message('')}
function renderStudent(requested,token){const a=studentAssignment,v=a.variants[variant];app.innerHTML=`<span class="quiet">ОҚУШЫ БЕТІ</span><h1>${esc(a.title)}</h1><p>${esc(a.grade)} · ${esc(v.name)}</p><div class="panel">${a.objectives?`<h2>Оқу мақсаттары</h2><pre>${esc(a.objectives)}</pre>`:''}<h2>Оқушыға нұсқаулық</h2><pre>${esc(a.instructions)}</pre><div class="grid"><label>Аты-жөніңіз<input id="studentName" maxlength="120" autocomplete="name" value="${esc(studentDraft.name||'')}"></label><label>Сыныбыңыз<input id="studentGrade" maxlength="60" value="${esc(studentDraft.grade||a.grade)}"></label></div>${requested===null&&a.variants.length>1?`<label>Мұғалім берген нұсқаны таңдаңыз<select id="variantSelect">${a.variants.map((v,i)=>`<option value="${i}" ${i===variant?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>`:''}</div><form id="studentForm"><div class="note">Жауаптарды тексеріп барып жіберіңіз. Жіберілген жұмыс қабылдау кодымен расталады.</div>${v.tasks.map((t,i)=>`<div class="panel"><div class="row spread"><h2>${i+1}-тапсырма</h2><span class="pill">${t.max} балл</span></div><pre>${esc(t.prompt)}</pre>${t.image?`<img class="task-image" src="/api/student/${token}/images/${esc(t.image)}" alt="${i+1}-тапсырманың суреті">`:''}${t.table?tableView(t,i,studentDraft.answers?.[i],true):`<label>Жауабыңыз<textarea class="long" data-answer="${i}" maxlength="10000" placeholder="Жауабыңызды осында жазыңыз…">${esc(studentDraft.answers?.[i]||'')}</textarea></label>`}</div>`).join('')}<button class="primary" id="submitWork" type="submit">Жұмысты жіберу →</button><p class="quiet">Интернет байланысы қажет. Қабылданғаны туралы хабар шыққанша бетті жаппаңыз.</p></form>`;app.oninput=captureStudent;if($('#variantSelect'))$('#variantSelect').onchange=e=>{const next=+e.target.value;if(studentDraft.answers?.some((a,i)=>!answerEmpty(a,studentAssignment.variants[variant].tasks[i]))&&!confirm('Нұсқаны өзгертсеңіз, осы нұсқадағы жауаптар тазаланады. Жалғастыру керек пе?')){e.target.value=variant;return}captureStudent();variant=next;studentDraft.answers=[];stashStudent();renderStudent(null,token)};$('#studentForm').onsubmit=e=>{e.preventDefault();run(async()=>{if(sending)return;captureStudent();if(!studentDraft.name?.trim()||!studentDraft.grade?.trim())throw Error('Аты-жөніңіз бен сыныбыңызды енгізіңіз.');if(studentDraft.answers.some(a=>a.length>10000))throw Error('Жауап тым ұзын: бір тапсырмаға 10 000 таңбаға дейін енгізіңіз.');if(studentDraft.answers.some((a,i)=>answerEmpty(a,v.tasks[i]))&&!confirm('Кейбір жауаптар бос. Жұмысты осылай жіберу керек пе?'))return;sending=true;$('#submitWork').disabled=true;try{const result=await api('/api/student/'+token+'/submit',{method:'POST',body:JSON.stringify({name:studentDraft.name,grade:studentDraft.grade,variant,answers:studentDraft.answers,requestId})});try{sessionStorage.setItem('task-'+studentAssignment.id,JSON.stringify({received:result.id}))}catch{}receipt(result.id)}finally{sending=false;if($('#submitWork'))$('#submitWork').disabled=false}})}}
run(async()=>{let token=location.pathname.match(/^\/s\/([a-f0-9]{32})$/)?.[1];if(token){await student(token);return}let me=await api('/api/me');if(me.teacher){await dashboard()}else{app.innerHTML='<div class="panel"><h1>Онлайн тапсырмалар</h1><p>Оқушы болсаңыз, мұғалім берген тапсырма сілтемесін ашыңыз.</p><p class="quiet">Мұғалім кабинеті тек Мадетхан Л. аккаунтына ашылады.</p><a class="button primary" href="/auth/google?return_to=%2Fonline" target="_top">Google арқылы мұғалім ретінде кіру</a></div>';$('#oldLink').classList.add('hidden')}});
</script></html>
